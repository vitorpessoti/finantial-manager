<div style="padding: 1rem; text-align: center">
    <h2 style="display: flex; justify-content: center;">Transactions History</h2>

    <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
        <button mat-flat-button color="primary" (click)="openCreateDialog()" style="margin: 0 .5rem;">
            New transaction
        </button>
        <button mat-flat-button color="primary" (click)="syncTransactions()" style="margin: 0 .5rem;">
            Sync my transactions
        </button>
    </div>

    <table mat-table [dataSource]="transactions" class="mat-elevation-z8 full-width"
        *ngIf="transactions.length; else vazio">
        <!-- Description -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let t"> {{ t.description }} </td>
        </ng-container>

        <!-- Type -->
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef> Type </th>
            <td mat-cell *matCellDef="let t"> {{ t.type.toUpperCase() }} </td>
        </ng-container>

        <!-- Value -->
        <ng-container matColumnDef="value">
            <th mat-header-cell *matHeaderCellDef> Amount </th>
            <td mat-cell *matCellDef="let t"> {{ t.value | currency:'BRL' }} </td>
        </ng-container>

        <!-- Category -->
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Category </th>
            <td mat-cell *matCellDef="let t"> {{ t.category }} </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let t"> {{ t.date | date:'shortDate' }} </td>
        </ng-container>

        <!-- Edit Button -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let t">
                <button mat-button color="primary" (click)="openEditDialog(t)">Edit</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <ng-template #vazio>
        <p>No transactions found.</p>
    </ng-template>
</div>
