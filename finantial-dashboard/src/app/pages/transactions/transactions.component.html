<h2>My transactions</h2>

<div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    Nova Transação
  </button>
</div>

<table mat-table [dataSource]="transactions" class="mat-elevation-z8 full-width"
    *ngIf="transactions.length; else vazio">
    <!-- Description -->
    <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let t"> {{ t.description }} </td>
    </ng-container>

    <!-- Type -->
    <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let t"> {{ t.type }} </td>
    </ng-container>

    <!-- Value -->
    <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef> Valor </th>
        <td mat-cell *matCellDef="let t"> {{ t.value | currency:'BRL' }} </td>
    </ng-container>

    <!-- Category -->
    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Categoria </th>
        <td mat-cell *matCellDef="let t"> {{ t.category }} </td>
    </ng-container>

    <!-- Date -->
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let t"> {{ t.date | date:'shortDate' }} </td>
    </ng-container>

    <!-- Edit Button -->
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let t">
            <button mat-button color="primary" (click)="openEditDialog(t)">Editar</button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<ng-template #vazio>
    <p>No transactions found.</p>
</ng-template>
